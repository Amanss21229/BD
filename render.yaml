services:
  - type: web
    name: jio-bihar-diwas
    runtime: node
    region: singapore
    plan: free
    buildCommand: "npm install -g pnpm && pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/bihar-diwas run build && pnpm --filter @workspace/api-server run build"
    startCommand: "node artifacts/api-server/dist/index.cjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: "10000"
