kind = "web"
previewPath = "/"
title = "Jio Bihar Diwas"
version = "1.0.0"
id = "artifacts/bihar-diwas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24873

[services.development]
run = "pnpm --filter @workspace/bihar-diwas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bihar-diwas", "run", "build" ]
publicDir = "artifacts/bihar-diwas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24873"
BASE_PATH = "/"
